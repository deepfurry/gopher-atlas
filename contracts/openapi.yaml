components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: __Host-gopheratlas_session
      description:
        'Opaque token; SHA-256 only in SQLite. Secure, HttpOnly, SameSite=Lax, Path=/, no
        Domain. Validated loopback HTTP development uses gopheratlas_dev_session. CSRF cookie:
        __Host-gopheratlas_csrf (or gopheratlas_dev_csrf in HTTP development), non-HttpOnly,
        host-only; mutation headers must match.'
    CSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description:
        Required for mutations. Must match the session-bound same-origin CSRF cookie and stored
        SHA-256 hash. Origin must also exactly match CMS_BASE_URL. Browser transport attaches the
        header automatically.
  responses:
    Error:
      description: Stable error envelope without provider/SQL details. See error.code for classification.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - githubUserId
        - githubLogin
        - role
        - status
        - createdAt
        - updatedAt
        - lastLoginAt
      properties:
        id:
          type: integer
          format: int64
        githubUserId:
          type: integer
          format: int64
        githubLogin:
          type: string
        role:
          type: string
          enum:
            - admin
            - reviewer
            - editor
        status:
          type: string
          enum:
            - pending
            - active
            - disabled
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        lastLoginAt:
          type:
            - integer
            - 'null'
          format: int64
    Profile:
      type: object
      additionalProperties: false
      required:
        - slug
        - displayName
        - bioMarkdown
        - avatarUrl
        - websiteUrl
      properties:
        slug:
          type: string
          readOnly: true
          description: Stable numeric-identity slug; cannot be changed in P0-1.
        displayName:
          type: string
        bioMarkdown:
          type: string
        avatarUrl:
          type: string
          readOnly: true
        websiteUrl:
          type: string
    ProfileInput:
      type: object
      additionalProperties: false
      required:
        - displayName
        - bioMarkdown
        - websiteUrl
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        bioMarkdown:
          type: string
          maxLength: 10000
          description:
            At most 10000 UTF-8 bytes. CommonMark/GFM with shared Markdown safety validation; no
            H1, frontmatter, HTML/MDX, unsafe URLs or external images.
        websiteUrl:
          type: string
          maxLength: 2048
          description: Empty or absolute HTTP(S) URL without credentials, whitespace or backslashes.
    Permissions:
      type: object
      additionalProperties: false
      required:
        - manageUsers
        - manageAuthorProfiles
        - editOwnProfile
        - review
        - publish
        - manageTaxonomy
        - retryBuild
        - viewAudit
        - viewMonitor
        - createTopic
      properties:
        manageUsers:
          type: boolean
        manageAuthorProfiles:
          type: boolean
        editOwnProfile:
          type: boolean
        review:
          type: boolean
        publish:
          type: boolean
        manageTaxonomy:
          type: boolean
        retryBuild:
          type: boolean
        viewAudit:
          type: boolean
        viewMonitor:
          type: boolean
        createTopic:
          type: boolean
    Me:
      type: object
      additionalProperties: false
      required:
        - user
        - profile
        - permissions
      properties:
        user:
          $ref: '#/components/schemas/User'
        profile:
          $ref: '#/components/schemas/Profile'
        permissions:
          $ref: '#/components/schemas/Permissions'
    UserList:
      type: object
      additionalProperties: false
      required:
        - users
        - nextCursor
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type:
            - integer
            - 'null'
          format: int64
          description: Use as after for the next page; null ends pagination.
    RoleInput:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
