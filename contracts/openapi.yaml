openapi: 3.1.0
info:
  title: GopherAtlas CMS identity and editorial API
  version: 0.3.0
  description:
    P0-3 private same-origin control plane. Publish selects an immutable SQLite revision,
    claims permanent routes and appends audit in one transaction; it does not rebuild the public
    site. Identity security and the separate Admin-only Monitor are unchanged. JSON requests are
    capped at 1 MiB; Markdown bodies at 512 KiB UTF-8 bytes.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://blog.go-furry.com
    description: Private Tailscale HTTPS origin
  - url: http://127.0.0.1:5173
    description: Loopback Vite same-origin proxy; CMS_BASE_URL/redirect must match
security:
  - Session: []
tags:
  - name: Runtime
    description: Local runtime checks
  - name: Auth
    description: OAuth and session lifecycle
  - name: Identity
    description: Current identity and author profile
  - name: Users
    description: Active Admin user management
  - name: Content
    description: Mutable drafts and immutable revision workflow
  - name: Reviews
    description: Immutable pending material and review history
  - name: Tags
    description: Admin-managed persistent taxonomy
  - name: Audit
    description: Append-only safe operation history
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - Runtime
      summary: Check process liveness
      description: Check process liveness
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /readyz:
    get:
      operationId: getReadiness
      tags:
        - Runtime
      summary: Check SQLite and complete identity/editorial schema version 2
      description:
        Read-only version and column probes. A P0-1-only database is not ready until migration
        2 is explicitly applied. Never migrates or contacts external services.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/auth/github:
    get:
      operationId: startGitHubLogin
      tags:
        - Auth
      summary: Start browser-bound GitHub OAuth
      description: Start browser-bound GitHub OAuth
      responses:
        '302':
          description: Redirect without exposing OAuth credentials to the Admin URL.
          headers:
            Location:
              schema:
                type: string
              description: Redirect destination
            Set-Cookie:
              schema:
                type: string
              description: Host-only cookies with SameSite=Lax; Secure for HTTPS, HttpOnly except CSRF.
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/auth/github/callback:
    get:
      operationId: completeGitHubLogin
      tags:
        - Auth
      summary: Consume state once and resolve GitHub identity
      description:
        Successful login rotates the prior session and issues session/CSRF cookies, then
        redirects to /. Unknown identities become pending. Disabled accounts are rejected. Provider
        access tokens are discarded after numeric identity lookup.
      responses:
        '303':
          description: Redirect without exposing OAuth credentials to the Admin URL.
          headers:
            Location:
              schema:
                type: string
              description: Redirect destination
            Set-Cookie:
              schema:
                type: string
              description: Host-only cookies with SameSite=Lax; Secure for HTTPS, HttpOnly except CSRF.
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: One-time value must match the initiating browser cookie.
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Short-lived provider code; never logged.
  /api/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Revoke the current session and expire cookies
      description:
        Available to active and pending sessions. Requires Origin and CSRF. Server-side
        revocation precedes cookie removal. Requires the exact configured Origin and a session-bound
        X-CSRF-Token header.
      responses:
        '204':
          description: Session revoked and cookies expired.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      security:
        - Session: []
          CSRF: []
  /api/admin/v1/me:
    get:
      operationId: getMe
      tags:
        - Identity
      summary: Read current identity and server-derived permissions
      description:
        Valid pending sessions may read this endpoint. Disabled users are rejected. No tokens
        or hashes are returned.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/v1/users:
    get:
      operationId: listUsers
      tags:
        - Users
      summary: List users as an active Admin
      description: List users as an active Admin
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
          description: Exclusive user ID cursor; pages contain at most 100 users.
  /api/admin/v1/users/{id}:
    get:
      operationId: getUser
      tags:
        - Users
      summary: Read a user as an active Admin
      description: Read a user as an active Admin
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
  /api/admin/v1/users/{id}/actions/approve:
    post:
      operationId: approveUser
      tags:
        - Users
      summary: approve a user as an active Admin
      description:
        Approve a pending account as Editor or Reviewer. Requires the exact configured Origin
        and a session-bound X-CSRF-Token header.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalInput'
      security:
        - Session: []
          CSRF: []
  /api/admin/v1/users/{id}/actions/disable:
    post:
      operationId: disableUser
      tags:
        - Users
      summary: disable a user as an active Admin
      description:
        Disable and revoke all sessions atomically. Reject disabling the last active Admin with
        last_admin_required. Requires the exact configured Origin and a session-bound X-CSRF-Token
        header.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      security:
        - Session: []
          CSRF: []
  /api/admin/v1/users/{id}/actions/enable:
    post:
      operationId: enableUser
      tags:
        - Users
      summary: enable a user as an active Admin
      description:
        Enable a disabled user without restoring revoked sessions. The user must sign in again.
        Requires the exact configured Origin and a session-bound X-CSRF-Token header.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      security:
        - Session: []
          CSRF: []
  /api/admin/v1/users/{id}/role:
    put:
      operationId: changeUserRole
      tags:
        - Users
      summary: Change a user role as an active Admin
      description:
        Reject demoting the last active Admin with last_admin_required. Permissions are
        resolved server-side on each request. Requires the exact configured Origin and a
        session-bound X-CSRF-Token header.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      security:
        - Session: []
          CSRF: []
  /api/admin/v1/authors/me:
    get:
      operationId: getOwnProfile
      tags:
        - Identity
      summary: Read the active user author profile
      description: Read the active user author profile
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateOwnProfile
      tags:
        - Identity
      summary: Update the active user author profile
      description:
        Update the active user author profile Requires the exact configured Origin and a
        session-bound X-CSRF-Token header.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      security:
        - Session: []
          CSRF: []
  /api/admin/v1/content:
    get:
      operationId: listContent
      tags:
        - Content
      summary: List visible content
      description:
        Visibility is applied inside the query, before pagination. Only Admin may include
        archived. Reviewer sees others only while in review, with immutable pending titles.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: after
          in: query
          description:
            Exclusive keyset cursor; default 0, fixed maximum 100 results. Revision lists use
            revisionNo; other lists use the returned row ID.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: includeArchived
          in: query
          description: Admin only when true.
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ContentType'
          description: Content type preset.
        - name: editorialState
          in: query
          schema:
            $ref: '#/components/schemas/EditorialState'
          description: Independent of published pointer.
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
          description:
            Case-insensitive literal title/summary substring; uses the visible Draft or immutable
            pending metadata. No FTS.
        - name: ownerUserId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Admin-only filter; object visibility is still enforced.
    post:
      operationId: createContent
      tags:
        - Content
      summary: Create identity and initial Draft
      description:
        Active roles create own Curated/Post/Note. Topic requires Admin. Initial version 1 may
        be incomplete; creator/owner/byline are the actor. Atomic creation audit.
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      security:
        - Session: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentInput'
  /api/admin/v1/content/{id}:
    get:
      operationId: getContent
      tags:
        - Content
      summary: Read visible content detail
      description: Reviewer inspecting another owner sees pending immutable material and no mutable Draft.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          description: Content or Tag identity.
          schema:
            type: integer
            format: int64
            minimum: 1
  /api/admin/v1/content/{id}/draft:
    put:
      operationId: saveDraft
      tags:
        - Content
      summary: Replace Draft with expected version
      description:
        Owner/Admin only, not archived or in_review. Saving synced changes state to draft and
        preserves published selection. No Audit event.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          description: Content or Tag identity.
          schema:
            type: integer
            format: int64
            minimum: 1
      security:
        - Session: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftInput'
  /api/admin/v1/content/{id}/revisions:
    get:
      operationId: listRevisions
      tags:
        - Content
      summary: List immutable revision summaries
      description:
        Reviewer viewing another owner may list only the current pending revision. after is
        exclusive revisionNo.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          description: Content or Tag identity.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: after
          in: query
          description:
            Exclusive keyset cursor; default 0, fixed maximum 100 results. Revision lists use
            revisionNo; other lists use the returned row ID.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
  /api/admin/v1/content/{id}/revisions/{revisionNo}:
    get:
      operationId: getRevision
      tags:
        - Content
      summary: Read immutable Revision with relations and review
      description:
        Visibility follows Content policy. Reviewer viewing another owner may fetch only the
        current pending revision.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          description: Content or Tag identity.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: revisionNo
          in: path
          required: true
          description: Immutable per-content revision number.
          schema:
            type: integer
            format: int64
            minimum: 1
  /api/admin/v1/content/{id}/revisions/{revisionNo}/actions/restore:
    post:
      operationId: restoreRevision
      tags:
        - Content
      summary: Copy a historical Revision into Draft
      description:
        Owner/Admin, expected current Draft version, not archived/in_review. Copy
        fields/tags/topic order and bump version; state draft. Preserve published pointer and
        immutable history. Non-Admin cannot use restoration to change featured.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          description: Content or Tag identity.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: revisionNo
          in: path
          required: true
          description: Immutable per-content revision number.
          schema:
            type: integer
            format: int64
            minimum: 1
      security:
        - Session: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
  /api/admin/v1/content/{id}/actions/submit-review:
    post:
      operationId: submitReview
      tags:
        - Content
      summary: Capture immutable Revision for review
      description:
        Owner/Admin from draft or changes_requested, expected Draft version. Complete
        validation and early route conflict check, snapshot relations, set exact pending pointer and
        audit.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          description: Content or Tag identity.
          schema:
            type: integer
            format: int64
            minimum: 1
      security:
        - Session: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
