          type: string
          const: reviewed
        revisionId:
          type: integer
          format: int64
          minimum: 1
        commentMarkdown:
          type: string
          description: Optional safe Markdown, at most 16384 UTF-8 bytes.
    PublishDirectInput:
      type: object
      additionalProperties: false
      required:
        - mode
        - version
      properties:
        mode:
          type: string
          const: direct
        version:
          type: integer
          format: int64
          minimum: 1
    PublishInput:
      oneOf:
        - $ref: '#/components/schemas/PublishReviewedInput'
        - $ref: '#/components/schemas/PublishDirectInput'
      discriminator:
        propertyName: mode
        mapping:
          reviewed: '#/components/schemas/PublishReviewedInput'
          direct: '#/components/schemas/PublishDirectInput'
    RouteList:
      type: object
      additionalProperties: false
      required:
