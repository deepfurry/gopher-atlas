        - displayName
        - avatarUrl
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
        slug:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
    AuthorDetail:
      type: object
      additionalProperties: false
      required:
        - userId
        - slug
        - displayName
        - avatarUrl
        - bioMarkdown
        - websiteUrl
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
        slug:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        bioMarkdown:
          type: string
        websiteUrl:
          type: string
    AuthorList:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthorSummary'
          maxItems: 100
        nextCursor:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: 'null'
    ContentActions:
      type: object
      additionalProperties: false
      required:
        - editDraft
        - submitReview
        - withdrawReview
        - directPublish
        - unpublish
        - archive
        - restoreArchive
        - restoreRevision
        - assignByline
        - setFeatured
      properties:
        editDraft:
          type: boolean
        submitReview:
          type: boolean
        withdrawReview:
          type: boolean
        directPublish:
          type: boolean
        unpublish:
          type: boolean
        archive:
          type: boolean
        restoreArchive:
          type: boolean
        restoreRevision:
          type: boolean
        assignByline:
          type: boolean
        setFeatured:
          type: boolean
      description:
        Server policy plus current state. Advisory UI projection; every mutation reauthorizes
        transactionally and validates exact version/revision and fields.
    ReviewActions:
      type: object
      additionalProperties: false
      required:
        - requestChanges
        - approvePublish
      properties:
        requestChanges:
          type: boolean
        approvePublish:
          type: boolean
    TopicTargetSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - type
        - published
        - archived
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
        type:
          $ref: '#/components/schemas/ContentType'
        published:
          type: boolean
        archived:
          type: boolean
      description:
        Label only; title may be empty when no visible immutable title exists. A reference
        never grants Draft access.
    ReviewDetail:
      type: object
      additionalProperties: false
      required:
        - content
        - revision
        - review
        - actions
      properties:
        content:
          $ref: '#/components/schemas/ContentSummary'
        revision:
          $ref: '#/components/schemas/Revision'
        review:
          anyOf:
            - $ref: '#/components/schemas/Review'
            - type: 'null'
        actions:
          $ref: '#/components/schemas/ReviewActions'
      description:
        Reviewer/Admin only. Exact immutable pending or reviewed Revision. Never contains a
        mutable Draft, including for Admin.
