            $ref: '#/components/schemas/AuditEvent'
          maxItems: 100
        nextCursor:
          type:
            - integer
            - 'null'
          format: int64
          description:
            Use as after for the next page. Null ends pagination. A full final page may yield one
            empty next page.
    CreateContentInput:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ContentType'
    VersionInput:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
